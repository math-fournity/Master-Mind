      - 候选C（★）在触发准确率上最优（2分），但提示成本最低（0分=最长）
      - 候选B（●）在提示成本上最优（1分=中等），触发准确率中等（1分）
      - 候选A（○）被B支配——提示成本与B相同，触发准确率更差
      - B和C互不支配——B在提示成本上更好，C在触发准确率上更好

    analysis: |
      Pareto前沿={候选B（baseline），候选C（扩展版）}。候选A（精简版）被B支配。
      关键发现：
      1. negative_boundary是必要的——删除它（候选A）只减少1个字段但失去假朋友拒绝能力
      2. binding_rules+critic是Pareto前沿上的增量价值——C在5维度上优于B，仅提示成本劣于B
      3. 提示成本是B vs C的核心trade-off
      4. 远迁移效用是所有候选的弱项（都只有1分）——A3/A4是gap无题目验证
      5. 可持续学习是B的弱项（0分）——只有C有critic能从失败中诊断和修复

