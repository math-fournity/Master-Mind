          这与383号核心发现（"方向Tell不够，需要操作路径Tell"）一致——操作路径粒度需更细。
      - finding_2: |
          准确性检查发现3个候选噪声（invariant_claim/trigger_boundary/parameter_slots）
          但都不是真正噪声——它们有合理的非因果功能（解释/选择）。
          4个因果充分字段（negative_boundary/internal_policy step4-5/progress_model信号2-4/termination）
          与383号核心发现一致。
      - finding_3: |
          Pareto前沿={候选B, 候选C}。候选A（删除negative_boundary）被B支配——
