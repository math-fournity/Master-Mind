          区分"在Z/pZ上工作"和"通过Z/pZ切换表示来揭示隐藏结构"。
      - finding_5: |
          变形关系覆盖：14个变换中7个有题目验证，7个gap无题目验证。
          有题目验证的7个变换100%被TellCore覆盖/拒绝/标为boundary。

    follow_up:
      - POC-2: 用候选B作为baseline测试trigger/negative_boundary的区分能力；如果假朋友拒绝率不足，升级到候选C
      - POC-2.5: 测试"只给方向意识"vs"给操作路径"的因果效应差异——预期"只给方向"无效（与1962 bare失败一致）
      - POC-3: 用候选C测试internal_policy操作路径充分性——重点验证case分裂和目标转移是否需要显式指引（用1962测试）
      - POC-3.5: 用Pareto前沿上的B和C分别渲染不同非特化程度HintInstance，验证钟形曲线/Pareto前沿
      - POC-7: 3条部分遗漏（思维C/D/F）作为修订候选记录输入；trigger_boundary增加"可提升性"检查
      - 未来题包扩展: 补充A3/A4（对象换壳/领域迁移）变形题，验证远迁移效用
