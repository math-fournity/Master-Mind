## §5 变形关系对照

### §5.1 允许变换覆盖检查（A1-A6）

用400号声明表检查TellCore的trigger_boundary是否覆盖允许变换：

| 变换 | 类型 | 有题目验证 | TellCore覆盖 | 覆盖字段 | 判定 |
|---|---|---|---|---|---|
| A1 | 变量重命名 | ❌gap | ✅理论覆盖 | trigger_boundary（不依赖变量名） | 理论覆盖（无题目验证） |
| A2 | 数值缩放 | ✅CC-009/010 | ✅覆盖 | trigger_boundary（"整除性/素性"不依赖具体数值）+ parameter_slots（p可绑定到不同值） | ✅覆盖 |
| A3 | 对象换壳 | ❌gap | ⚠️部分覆盖 | trigger_boundary（"可以局部化的对象"不限于整数），但binding_rules的绑定规则是数论特定的 | 部分覆盖（无题目验证） |
