### §5.5 CC-203/CC-204的trigger设计启示

**CC-203**（鸽巢+子集计数）：AI实际尝试了Z/dZ上的Fourier分析，比标准解答更接近局部-全局切换但仍不是。
**CC-204**（概率方法）：AI实际尝试了CRT分解Z_100=Z_4×Z_25，比标准解答更接近局部-全局切换但仍不是。

**TellCore的trigger_boundary/negative_boundary是否区分了"在Z/pZ上工作"和"通过Z/pZ切换表示来揭示隐藏结构"？**

分析：
- trigger_boundary的"问题涉及整数的代数结构（整除性/素性/符号/周期性）"+"自然表示下的分析陷入困境"——这两个条件在CC-203/204上都会满足（涉及mod d/mod N²，且AI在自然表示下确实陷入困境）
- negative_boundary的"构造性而非分析性""分析估计而非代数结构"——CC-204的"概率方法/期望论证"被"分析估计而非代数结构"拒绝 ✅。但CC-203的"鸽巢+子集计数"不完全匹配任何negative_boundary条目
- **关键区分缺失**：TellCore没有显式区分"在Z/pZ上工作"和"通过Z/pZ切换表示来揭示隐藏结构"。CC-203的AI在Z/dZ上做了Fourier分析——这是"在Z/dZ上工作"，但不是"通过Z/dZ切换表示来揭示隐藏结构"（鸽巢原理不需要表示切换）

**启示**：trigger_boundary需要增加一个条件——"局部表示下的发现需要能提升回全局问题"。目前的trigger_boundary只检查"是否涉及代数结构"和"是否陷入困境"，但没有检查"局部表示下的工作是否能揭示隐藏结构并提升回全局"。这个区分对CC-203/204类假朋友题的拒绝是关键的。

**建议**：在POC-7可持续学习中，考虑在trigger_boundary或critic中增加"局部发现的可提升性"检查——如果局部表示下的工作无法提升回全局问题（如鸽巢原理的计数结果不是"隐藏结构"的揭示），则不应触发TellCore。

