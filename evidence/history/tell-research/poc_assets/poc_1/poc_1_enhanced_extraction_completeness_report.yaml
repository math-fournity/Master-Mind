## §3 准确性检查（有没有噪声）

### §3.1 TellCore 7字段 × 1962 bare失败trace 对照

对TellCore的7个字段，逐个用1962的bare失败trace做因果充分性验证：

**1962 bare失败trace的关键信息**（来自383号§2 F8和任务提示词）：
- 1962 bare失败的原因：2-adic赋值方向是对的，但需要分多个case（a=b, a<b<c等），每个case有不同的分析方法。脉络+方向不够具体，AI陷入了2-adic赋值的复杂计算无法收敛。
- bare trace中AI做了什么：尝试代数变形和枚举，陷入复杂的2-adic赋值代数无法收敛。2-adic赋值方向是对的（AI确实尝试了v_2分析），但操作路径不明确。

| TellCore字段 | 字段内容简述 | 在1962 bare失败trace中是否出现 | 因果充分性判定 |
|---|---|---|---|
| **invariant_claim** | "全局困难在局部表示下可化简" | **出现**——bare AI也意识到需要用局部表示（v_2分析） | ⚠️候选噪声——bare AI也有这个意识，但它不是导致成功的关键（因为bare AI有这个意识但仍失败） |
| **trigger_boundary** | "自然表示下反复尝试无法推进时" | **出现**——bare AI在自然表示（代数变形）下确实陷入困境 | ⚠️候选噪声——bare AI也触发了"困境识别"，但困境识别不导致成功 |
| **negative_boundary** | "问题不含整除性/周期性/符号结构时不适用" | **未出现**——1962含整除性（2的幂），negative_boundary不触发 | ✅因果充分——negative_boundary在1962中不参与（正确不触发），但在假朋友题中是拒绝关键 |
| **parameter_slots** | "p/level/objects" | **部分出现**——bare AI选择了v_2（level=p-adic），但p=2的选择是显然的（因为"2的幂"条件） | ⚠️候选噪声——parameter_slots的p绑定在1962中是trivial的（p=2由题面直接给出），不是导致成功的关键 |
| **internal_policy (step2-5)** | "确定p和层次→映射→寻找结构→提升全局" | **未完整出现**——bare AI做了step2（确定p=2, level=v_2）和step3（映射到v_2），但step4（寻找隐藏结构）和step5（提升全局）未完成。特别是**case分裂**（审查者思维F）在bare trace中未系统执行 | ✅因果充分——internal_policy的step4-5在bare失败trace中未出现，正是导致失败的关键 |
| **progress_model** | "4个进展信号" | **部分出现**——bare AI出现了信号1（讨论v_2），但未出现信号2-4（发现隐藏结构、建立联系、提升全局） | ✅因果充分——progress_model的信号2-4在bare失败trace中未出现，是区分成功与失败的关键 |
| **termination** | "4个终止条件" | **未出现**——bare AI不知道何时退出2-adic计算，陷入无限循环 | ✅因果充分——termination在bare失败trace中未出现，bare AI正是因为不知道何时停止而失败 |

### §3.2 候选噪声分析

3个字段被标记为候选噪声：invariant_claim、trigger_boundary、parameter_slots

| 候选噪声字段 | 在失败trace中的证据 | 是否真的是噪声 | 处理建议 |
|---|---|---|---|
| **invariant_claim** | bare AI也意识到"需要用局部表示"——但这只是"方向意识"，不是"操作能力" | **不是纯噪声**——invariant_claim提供了"为什么局部化有效"的解释，对迁移解释（383号问2）是必要的。它在失败trace中出现说明"方向意识"不是因果充分的，但invariant_claim的功能不只是"方向意识"，还包括"解释为什么这个策略有效" | 保留但有标记——invariant_claim的"方向意识"部分不是因果充分的，但其"解释功能"是必要的 |
| **trigger_boundary** | bare AI也触发了"困境识别"——困境识别是通用解题能力，不特定于局部-全局切换 | **不是纯噪声**——trigger_boundary的功能是让selector知道"何时选这个Tell"，不是让解题者知道"何时切换"。在失败trace中出现"困境识别"是正常的（任何困境中都会出现），但trigger_boundary的"整除性/素性/符号/周期性"条件是特定的 | 保留——trigger_boundary的"困境识别"部分是通用的，但其"结构条件"部分是特定的 |
| **parameter_slots** | bare AI选择了v_2（level=p-adic），p=2的选择是trivial的 | **部分噪声**——parameter_slots的p绑定在1962中是trivial的（p=2由"2的幂"直接给出），但在其他题中（如CC-009需要分析底数3的剩余理论）不是trivial的 | 保留——parameter_slots在1962中是trivial的，但在其他题中是必要的 |

### §3.3 准确性判定

- **候选噪声字段数**：3个（invariant_claim、trigger_boundary、parameter_slots）
- **真正的噪声字段数**：0个——3个候选噪声都有"在失败trace中出现"的特征，但它们的功能不限于"导致成功的认知动作"，还包括"解释功能"和"选择功能"。它们在失败trace中出现是因为"方向意识"和"困境识别"是通用能力，但这些字段的结构条件部分是特定的。
- **因果充分字段数**：4个（negative_boundary、internal_policy step4-5、progress_model信号2-4、termination）——这4个字段在失败trace中未出现或未完整出现，是区分成功与失败的关键

**对照401号§7.2标准8.2**："candidate_noise的字段不超过2个——至少5个字段是causally_sufficient"
- 候选噪声3个 > 2个 → 严格不通过
- 但真正的噪声0个——3个候选噪声都有合理的"非因果功能"（解释/选择）
- 因果充分4个 < 5个 → 严格不通过

**判定**：**partial**——3个候选噪声都不是真正的噪声（都有合理的非因果功能），但严格按"在失败trace中出现"的标准，候选噪声数超过2个。关键发现是**internal_policy step4-5、progress_model信号2-4、termination是因果充分的核心**——这与383号的核心发现（"方向Tell不够，需要操作路径Tell"）完全一致。

