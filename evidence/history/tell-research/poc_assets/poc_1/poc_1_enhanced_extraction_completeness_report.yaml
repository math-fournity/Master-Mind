## §4 偏差性检查（有没有偏差）

### §4.1 提取分布

统计独立审查者从4道题提取的解题思维数量：

| 题目 | 层面 | 提取的思维数 | 跨题汇总中贡献的思维 |
|---|---|:---:|---|
| 1631 | 模p（模8+二次剩余） | 4 | 思维A/B/C/D/E |
| 1843 | 模p（模4+符号配对） | 4 | 思维A/B/C/D/H/J |
| 1709 | p-adic（2-adic赋值） | 4 | 思维A/B/C/D/E/F |
| 1962 | p-adic（2-adic赋值） | 5 | 思维A/B/C/D/E/F/G/I |

### §4.2 偏差分析

**模p层面（1631+1843）**：8条思维，贡献跨题思维A/B/C/D/E/H/J（7条）
**p-adic层面（1709+1962）**：9条思维，贡献跨题思维A/B/C/D/E/F/G/I（8条）

- p-adic层面提取的思维数（9）≥ 模p层面提取的思维数（8）
- p-adic层面贡献的跨题思维数（8）≥ 模p层面贡献的跨题思维数（7）
- **从1709/1962提取的字段数（8）≥ 从1631/1843提取的字段数（7）的50%** → ✅无偏差

**偏差方向**：实际上p-adic层面提取的思维略多于模p层面——这是因为1962有5条思维（包括失败教训思维I），而其他题都是4条。1962的失败教训提供了额外的认知信号。

**偏差判定**：**无偏差**——4道题的提取分布均衡，p-adic层面（1709/1962）不仅没有被忽略，反而因为1962的失败教训而略多。

**对照401号§7.2标准8.3**："从1709/1962（p-adic层面）提取的字段数不低于从1631/1843（模p层面）提取的字段数的50%"
- 8 ≥ 7 × 50% = 3.5 → ✅通过

### §4.3 抽象层次偏差检查

独立审查者的提取抽象层次与TellCore v0的对比：

| 维度 | 审查者提取 | TellCore v0 | 偏差 |
|---|---|---|---|
| 抽象层次 | 中-高——"模降维""目标转移"等是高于具体数学技术的认知策略 | 高——"局部-全局表示切换"是更高层的抽象 | 审查者提取略低于TellCore——审查者停留在"模降维"层面，TellCore提升到"局部-全局切换"层面 |
| 因果方向 | 正确——"什么认知动作导致了进展" | 正确——"什么认知动作导致了成功转向" | ✅无偏差 |
| 权重 | 均衡——4道题的思维权重相近 | 偏向internal_policy——383号将internal_policy step2-5作为核心 | 轻微权重偏差——TellCore更强调操作路径（internal_policy），审查者更均衡地看待各层认知动作 |

**抽象层次偏差判定**：**轻微偏差**——审查者提取的抽象层次略低于TellCore。审查者停留在"模降维""目标转移"等具体策略层面，而TellCore提升到"局部-全局表示切换"这个更高层的统一概念。这不是错误——审查者是独立提取，自然倾向于更具体的策略描述。TellCore的更高层抽象是"因果取商"的结果——把"模降维""目标转移"等具体策略取商为"局部-全局表示切换"。

