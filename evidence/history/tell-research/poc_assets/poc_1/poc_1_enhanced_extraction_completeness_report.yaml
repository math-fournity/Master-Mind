## §2 完备性检查（有没有遗漏）

### §2.1 审查者提取的10条跨题思维 → TellCore字段映射

将独立审查者的10条跨题解题思维（A-J）逐一映射到383号TellCore v0的7字段最小充分集：

| 审查者思维 | 认知动作简述 | TellCore对应字段 | 映射判定 |
|---|---|---|---|
| **思维A**：小case验证确立边界 | 先枚举小case确立答案候选，再做一般性证明 | **无直接对应** | ⚠️潜在遗漏 |
| **思维B**：模降维 | 当值空间太大时，寻找模数m做降维 | invariant_claim（"局部表示下化简"）+ internal_policy step3（"映射到局部表示"） | ✅有对应 |
| **思维C**：结构信号定向探测 | 模数选择由已知定理决定——定向探测而非随机检查 | **无直接对应** | ⚠️潜在遗漏 |
| **思维D**：目标转移 | 当直接目标受阻时，攻击理论工具能直接给出的结论指向的目标 | **无直接对应** | ⚠️潜在遗漏 |
| **思维E**：代数恒等式桥接 | 识别理论结论的代数形式与问题中量的关系 | internal_policy step5（"将局部发现提升为全局结论"） | ✅有对应（部分） |
| **思维F**：case分裂 | 按关键变量相等/不等关系分case | **无直接对应** | ⚠️潜在遗漏 |
| **思维G**：乘积的2-adic分解 | xy是2的幂→x,y各自是2的幂 | **无直接对应**（这是具体数学工具，TellCore不包含具体lemma） | ✅合理不包含（泄漏风险考量） |
| **思维H**：逐点条件替代全局条件 | 全局条件转化为逐点条件 | internal_policy step5（"提升为全局结论"） | ✅有对应（部分） |
| **思维I**：方向正确≠操作路径明确 | 降维后操作的可执行性是独立瓶颈 | internal_policy step2-5（操作路径）+ progress_model（进展信号） | ✅有对应（核心对应） |
| **思维J**：IVT/次数论证建立必要约束 | 用分析工具建立子集大小/参数范围的必要约束 | **无直接对应** | ⚠️潜在遗漏 |

### §2.2 映射结果统计

- **有对应**：5条（思维B/E/H/I + 思维G合理不包含）= 50%
- **无直接对应（潜在遗漏）**：5条（思维A/C/D/F/J）= 50%

### §2.3 遗漏分析

对5条"无直接对应"的思维逐一分析严重性：

#### 遗漏1：思维A（小case验证确立边界）

- **严重性**：**low**
- **分析**：小case验证是通用解题策略，不特定于"局部-全局表示切换"这个Tell家族。它属于"解题基本功"而非"局部-全局切换的因果结构"。TellCore的设计目标是提取"什么认知动作导致了局部-全局切换的成功"，而非"所有解题中用到的认知动作"。小case验证在4道题中都出现，但它不是区分成功与失败的关键——bare AI也会做小case验证（1962的bare trace中AI也尝试了a=1排除）。
- **结论**：合理遗漏——不属于TellCore的因果结构。

#### 遗漏2：思维C（结构信号定向探测——模数选择由已知定理决定）

- **严重性**：**medium**
- **分析**：这是一个比"模降维"更精细的认知动作——它指出模数的选择不是随机的，而是由"哪个已知定理能利用这个模数"决定的。TellCore的binding_rules（重要补充字段，非7字段最小充分集）部分覆盖了这个思维——"整除性→模p，幂→p-adic"就是"什么问题结构用什么模数"的规则。但binding_rules不在7字段最小充分集中，且binding_rules给出的是"问题类型→模数"的映射，而非审查者描述的"定理→模数"的映射。
- **结论**：部分遗漏——binding_rules（重要补充）部分覆盖，但7字段最小充分集未覆盖。建议在POC-7可持续学习中考虑将"定理→模数"的定向探测意识纳入binding_rules的扩展。

#### 遗漏3：思维D（目标转移——攻击理论工具能直接给出的结论指向的目标）

- **严重性**：**medium**
- **分析**：目标转移是一个重要的元认知策略——当直接目标受阻时，不坚持原目标，而是检查理论工具能给出什么，转而攻击那个目标。1631中"不证y₃合数，证y₂合数"是典型的目标转移。TellCore的7字段中没有显式描述这个策略。internal_policy step4"在局部表示下寻找隐藏结构"隐含了"寻找什么结构"的灵活性，但没有显式说"如果原目标受阻，转移目标"。
- **结论**：部分遗漏——internal_policy step4隐含了目标转移的可能性，但未显式描述。这是"操作路径"层面的细节，可能需要在POC-3可执行验证中测试AI是否能从step4自然推导出目标转移。

#### 遗漏4：思维F（case分裂——按关键变量相等/不等关系分case）

- **严重性**：**medium**
- **分析**：case分裂在1962中是关键操作——a=b vs a<b<c是完全不同的分析路径。TellCore的internal_policy step2-5没有显式提到case分裂。383号§4.4的1962验证中提到"step2: 确定p=2，level=p-adic赋值；step3: 对a,b,c计算v_2..."——但没有提到"按a与b的关系分case"。1962在tree组失败的部分原因可能就是操作路径中没有显式的case分裂指引。
- **结论**：部分遗漏——internal_policy的操作路径可能需要增加case分裂步骤。这与383号的核心发现（"方向Tell不够，需要操作路径Tell"）一致——操作路径的粒度可能还需要更细，包括case分裂。

#### 遗漏5：思维J（IVT/次数论证建立必要约束）

- **严重性**：**low**
- **分析**：IVT/次数论证是1843特有的前置约束建立步骤，不是"局部-全局表示切换"的核心认知动作。它属于"解题基本功"而非"局部-全局切换的因果结构"。在4道题中只在1843出现，不具有跨题共性。
- **结论**：合理遗漏——不属于TellCore的因果结构。

### §2.4 完备性判定

- **遗漏项数**：5条（思维A/C/D/F/J）
- **合理遗漏**（不属于TellCore因果结构）：2条（思维A小case验证、思维J IVT论证）= 20%
- **部分遗漏**（binding_rules或internal_policy隐含但未显式）：3条（思维C定向探测、思维D目标转移、思维F case分裂）= 30%
- **high severity遗漏**：0条

**完备性判定**：
- 严格按"有对应字段"计算：5/10 = 50%有对应，遗漏50%
- 按"合理遗漏不计入"计算：5/8 = 62.5%有对应或合理不包含，部分遗漏37.5%
- **无high severity遗漏**——3条部分遗漏都是medium severity，且binding_rules（重要补充）部分覆盖了思维C

**对照401号§7.2标准8.1**："遗漏项不超过20%，且没有high severity的遗漏"
- 如果按"严格有对应字段"计算：遗漏50% > 20% → 不通过
- 如果按"合理遗漏不计入"计算：部分遗漏37.5% > 20% → 不通过
- **但**：3条部分遗漏中，思维C被binding_rules（重要补充字段）部分覆盖，思维D被internal_policy step4隐含覆盖，思维F是操作路径的粒度问题（383号已发现的核心教训的延伸）

**判定**：**partial**——无high severity遗漏，但有3条medium severity的部分遗漏。这些遗漏指向binding_rules和internal_policy的粒度不足，是POC-7可持续学习的修订候选。

