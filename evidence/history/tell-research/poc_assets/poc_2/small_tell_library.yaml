# POC-2 资产 · 小型Tell库

# 小型Tell库：1目标 + 3近邻 + 2错配 + 1通用反思
# 来源：402号§4.3的设计要求 + 383号TellCore v0候选C的7字段最小充分集
# 用途：POC-2（可选择）的selector测试——验证系统能否正确选中/拒绝目标TellCore
# 日期：2026-08-17

---

# ============================================================
# 目标TellCore（完整7字段）
# ============================================================
# 来源：383号TellCore v0候选C（局部-全局表示切换）
# 这是selector应该在正迁移题上选中、在假朋友题上拒绝的TellCore

target_tell_core:
  tell_id: TGT-001
  name: 局部-全局表示切换
  tell_type: target

  invariant_claim: |
    当问题在全局/自然表示下陷入困境时，
    切换到局部表示（Z/pZ的模算术 或 Q_p的p-adic赋值），
    在局部表示下揭示隐藏的代数结构，
    将局部发现提升为全局结论。

    局部表示有两个层次：
    - 层次1（模p）：将整数映射到Z/pZ，在有限环中分析
    - 层次2（p-adic）：使用v_p精确度量整除性，在Q_p中分析

    层次1是层次2的特例。选择哪个层次取决于问题条件：
    - 涉及整除性/符号/周期性 → 层次1（模p）
    - 涉及"是p的幂"/"被p^k整除" → 层次2（p-adic赋值）

  trigger_boundary:
    - 问题涉及整数的代数结构（整除性、素性、符号、幂、周期性）
    - 自然表示下的分析陷入困境
    - 问题中存在可以局部化的对象

  negative_boundary:
    - 问题核心在构造性而非分析性
    - 问题核心在几何结构而非代数结构
    - 问题已经在局部表示下
    - 问题在自然表示下有直接解法
    - 问题的核心困难在搜索空间大小而非结构隐藏

  parameter_slots:
    - p: 局部化的目标素数
    - level: 模p 或 p-adic赋值
    - objects: 需要局部化的对象

  internal_policy:
    step2: 分析问题条件，确定局部化目标p和层次
    step3: 将问题映射到局部表示
    step4: 在局部表示下寻找隐藏结构
    step5: 将局部发现提升为全局结论或约束

  progress_model:
    - 信号1: AI开始讨论"取模"或"p-adic赋值"
    - 信号2: AI在局部表示下发现了隐藏结构
    - 信号3: AI将局部发现与原问题目标建立联系
    - 信号4: AI成功将局部发现提升为全局结论

  termination:
    - 成功: 局部发现直接解决原问题或给出关键约束
    - 无进展: 尝试多个p或层次后未发现有用结构 → 退出
    - 部分进展: 局部发现给出部分约束 → 标记，考虑组合或分case
    - 冲突: 局部化导致丢失必要信息 → 让位给全局分析Tell

# ============================================================
# 近邻TellCore（3个，简化版——只写invariant_claim和trigger_boundary）
# ============================================================
# 构造原则（402号§4.3）：与目标TellCore拓扑相同但距离极近——
# 同属局部-全局切换但不同子类型。
# selector需要能区分目标TellCore和近邻TellCore。

---

# 近邻1：p-adic赋值型局部-全局切换
# 与目标TellCore的关系：目标TellCore偏mod p（层次1），近邻1偏p-adic（层次2）
# selector需要区分：问题条件涉及"是p的幂"时，应优先近邻1而非目标TellCore

near_neighbor_1:
  tell_id: NN-001
  name: p-adic赋值型局部-全局切换
  tell_type: near_neighbor

  invariant_claim: |
    当问题涉及"是p的幂"或"被p^k整除"的条件，
    且自然代数变形无法约束解空间时，
    系统地使用p-adic赋值v_p可以精确度量整除性，
    揭示隐藏的幂结构，将问题转化为v_p的代数方程。

    与目标TellCore的区别：目标TellCore统一覆盖模p和p-adic两个层次，
    本近邻专门针对p-adic赋值（层次2），不涉及模p分析（层次1）。
    当问题条件明确涉及"幂次"而非"整除性/符号/周期性"时，
    本近邻比目标TellCore更精确。

  trigger_boundary:
    - 问题涉及"是p的幂"或"被p^k整除"的条件
    - 自然代数变形无法约束解空间
    - 问题中存在可以用v_p分析的对象
    - 问题的核心困难在幂次结构而非符号配对或周期性

  negative_boundary: 待POC-2执行时补充
  parameter_slots: 待POC-2执行时补充
  internal_policy: 待POC-2执行时补充
  progress_model: 待POC-2执行时补充
  termination: 待POC-2执行时补充

---

# 近邻2：CRT多模数组合型局部-全局切换
# 与目标TellCore的关系：目标TellCore偏单一模数，近邻2偏多模数组合
# selector需要区分：问题需要多个模数的组合信息时，应优先近邻2

near_neighbor_2:
  tell_id: NN-002
  name: CRT多模数组合型局部-全局切换
  tell_type: near_neighbor

  invariant_claim: |
    当问题在单一模数下无法完全确定解的结构，
    但在多个不同模数的组合下可以约束解时，
    使用中国剩余定理（CRT）将多个模p_i的信息组合，
    从局部信息重建全局结构。

    与目标TellCore的区别：目标TellCore通常使用单一模数p做局部化，
    本近邻专门处理需要多个模数组合的场景。
    当单一模数分析给出不完全约束时，本近邻提供组合策略。

  trigger_boundary:
    - 单一模数分析给出了部分但不完全的约束
    - 问题涉及多个不同素数的整除性条件
    - 解的结构需要多个局部信息的组合才能确定
    - 问题中存在可以对多个不同p取模的对象

  negative_boundary: 待POC-2执行时补充
  parameter_slots: 待POC-2执行时补充
  internal_policy: 待POC-2执行时补充
  progress_model: 待POC-2执行时补充
  termination: 待POC-2执行时补充

---

# 近邻3：二次剩余+Euler准则型局部-全局切换
# 与目标TellCore的关系：目标TellCore覆盖一般模p分析，近邻3专门针对二次剩余判定
# selector需要区分：问题核心在二次剩余性判定时，应优先近邻3

near_neighbor_3:
  tell_id: NN-003
  name: 二次剩余+Euler准则型局部-全局切换
  tell_type: near_neighbor

  invariant_claim: |
    当问题涉及"某数是否是模p的二次剩余"的判定，
    且直接计算不可行时，
    使用Euler准则（a^{(p-1)/2} mod p）或Legendre符号的性质，
    将二次剩余性转化为可计算的模p判定。

    与目标TellCore的区别：目标TellCore是一般的"切换到局部表示"策略，
    本近邻专门针对二次剩余性这一特定结构。
    当问题条件明确涉及平方/剩余性时，本近邻比目标TellCore更精确。

  trigger_boundary:
    - 问题涉及"是否是二次剩余"或"是否可以开平方"的判定
    - 问题涉及Legendre符号或二次互反性的应用条件
    - 直接计算或枚举不可行，但模p下的二次剩余判定可以给出约束
    - 问题中存在可以计算a^{(p-1)/2} mod p的对象

  negative_boundary: 待POC-2执行时补充
  parameter_slots: 待POC-2执行时补充
  internal_policy: 待POC-2执行时补充
  progress_model: 待POC-2执行时补充
  termination: 待POC-2执行时补充

# ============================================================
# 错配TellCore（2个，简化版——只写invariant_claim和trigger_boundary）
# ============================================================
# 构造原则（402号§4.3）：完全不同思维力的TellCore——不是局部-全局切换。
# selector需要能在需要局部-全局切换的题上不选错配TellCore。

---

# 错配1：构造-分析-排除（构造性证明策略）
# 与目标TellCore的关系：完全不同的思维力——构造性证明而非表示切换

mismatch_1:
  tell_id: MM-001
  name: 构造-分析-排除
  tell_type: mismatch

  invariant_claim: |
    当问题要求"求所有满足条件的对象"或"证明某对象存在/不存在"时，
    先尝试构造满足条件的具体对象（构造），
    分析构造出的对象的必要结构约束（分析），
    排除不可能的情况（排除），
    最终确定解的完整集合。

    与目标TellCore的区别：本TellCore是构造性证明策略——
    从"构造具体对象"入手，不是从"切换表示"入手。
    适用于需要构造解的问题，不适用于需要分析隐藏结构的问题。

  trigger_boundary:
    - 问题要求"求所有满足条件的对象"
    - 问题要求"证明某对象存在或不存在"
    - 问题的核心在构造而非分析
    - 存在可以尝试构造的具体对象

  negative_boundary: 待POC-2执行时补充
  parameter_slots: 待POC-2执行时补充
  internal_policy: 待POC-2执行时补充
  progress_model: 待POC-2执行时补充
  termination: 待POC-2执行时补充

---

# 错配2：极值原理/最大最小（从极端情况入手）
# 与目标TellCore的关系：完全不同的思维力——极端分析而非表示切换

mismatch_2:
  tell_id: MM-002
  name: 极值原理/最大最小
  tell_type: mismatch

  invariant_claim: |
    当问题涉及"最大""最小""最优""极端"等条件时，
    从极端情况入手分析——
    考虑最大/最小的元素、边界值、退化情形，
    利用极端情况的特殊性质推导一般性结论。

    与目标TellCore的区别：本TellCore从"极端情况"入手——
    分析最大/最小/边界值，不是从"切换到局部表示"入手。
    适用于涉及极值/边界的问题，不适用于需要隐藏结构显化的问题。

  trigger_boundary:
    - 问题涉及"最大""最小""最优"条件
    - 问题涉及边界值或极端情形的分析
    - 极端情况的性质可以推导一般性结论
    - 问题中存在可以取极值的对象

  negative_boundary: 待POC-2执行时补充
  parameter_slots: 待POC-2执行时补充
  internal_policy: 待POC-2执行时补充
  progress_model: 待POC-2执行时补充
  termination: 待POC-2执行时补充

# ============================================================
# 通用反思Tell（1个）
# ============================================================
# 构造原则（402号§4.3）：不包含特定思维力的通用反思提示——
# 对任何题都"有点用"但不是目标Tell。
# 测试selector能否不被通用Tell抢占top位置。

general_reflection:
  tell_id: GR-001
  name: 通用反思——列出已尝试路线再选新路线
  tell_type: general_reflection

  invariant_claim: |
    当你在解题过程中卡住时，
    请先列出已经尝试过的所有路线，
    再列出每条路线遇到的障碍，
    然后选择一条尚未尝试的新路线。

    这是一个通用的解题策略，不针对任何特定数学结构。
    它对任何题都"有点用"——因为列出已尝试路线和障碍总是有益的。
    但它不提供具体的数学方向。

  trigger_boundary:
    - AI在解题过程中表现出卡住或重复尝试的信号
    - AI在thinking中反复尝试同一路径但未取得进展
    - 解题过程超过一定长度但未产生新结论

  negative_boundary:
    - AI正在顺利解题——不需要打断
    - AI刚刚取得新进展——不需要反思

  parameter_slots:
    - attempted_routes: 已尝试的路线列表
    - obstacles: 每条路线遇到的障碍
    - new_route: 选择的新路线

  internal_policy:
    step1: 列出已尝试的所有路线
    step2: 对每条路线，列出遇到的具体障碍
    step3: 分析障碍的共同模式——是否所有路线都遇到同一类问题？
    step4: 选择一条尚未尝试的新路线
    step5: 在新路线上开始工作

  progress_model:
    - 信号1: AI开始列举已尝试路线
    - 信号2: AI识别出障碍的共同模式
    - 信号3: AI选择了一条新路线
    - 信号4: AI在新路线上取得了进展

  termination:
    - 成功: AI在新路线上取得进展
    - 无进展: AI列出路线后发现没有新路线可尝试 → 退出
    - 部分进展: AI识别了障碍模式但未找到新路线 → 标记，考虑寻求外部提示

# ============================================================
# Tell库汇总
# ============================================================

tell_library_summary:
  total_tells: 7
  target_tell: TGT-001（局部-全局表示切换）
  near_neighbor_tells:
    - NN-001（p-adic赋值型局部-全局切换）
    - NN-002（CRT多模数组合型局部-全局切换）
    - NN-003（二次剩余+Euler准则型局部-全局切换）
  mismatch_tells:
    - MM-001（构造-分析-排除）
    - MM-002（极值原理/最大最小）
  general_reflection_tell: GR-001（通用反思——列出已尝试路线再选新路线）

  # selector测试要点：
  # - 正迁移题（CC-001~008）：TGT-001应进入top-2
  # - 假朋友题（CC-013~017）：TGT-001应被拒绝或降权
  # - 边界题（CC-018~020）：TGT-001应标为boundary
  # - 近邻TellCore不应挤掉TGT-001在正迁移题上的top位置
  # - 通用反思Tell不应抢占top-1
  # - 错配TellCore不应在需要局部-全局切换的题上被选中
