# POC-3.5 的5个HintInstance完整文本——局部-全局表示切换

**资产编号**：POC-3.5-Asset-1
**服务POC**：POC-3.5 Hint非特化程度验证
**依赖**：383号TellCore v0候选C（✅）、403号方案文档（✅已设计5个HintInstance）
**状态**：就绪

---

## 说明

5个HintInstance都来自同一个TellCore（383号候选C——局部-全局表示切换，7字段最小充分集）。HintRenderer的渲染参数（非特化程度）不同，产出5个不同非特化程度的HintInstance。

POC-3.5的实验逻辑：**固定TellCore不变，只改变HintRenderer的渲染参数（非特化程度），观察HintInstance的AI指导力变化**。

---

## Hint-L1：极低非特化程度（题目特化）

**非特化程度**：极低
**提示词形态**：形态1（一句话指示）
**特征**：包含题目特定信息（具体的模数、具体的对象），几乎等同于"告诉AI这道题怎么做"
**泄漏风险**：高——包含题目特定参数，但POC-3.5只在正迁移题（匹配题）上测试，不测试泄漏问题

**Hint-L1文本（针对排列存在性问题示例）**：
```
对这道题，考虑用模4将排列分成两类，利用奇偶性分析元素的对换结构。
```

**为什么这是"极低非特化程度"**：
- "模4"是题目特定的参数（parameter_slots中"局部表示的选择"被绑定为Z/4Z）
- "排列分成两类"是题目特定的操作（internal_policy被具体化为这道题的操作）
- "对换结构"是题目特定的对象（invariant_claim被具体化为这道题的不变量）
- 这个Hint只适用于这一道排列存在性题，换一道题（如整除性问题）就不能用

**预期AI指导力**：高（在这道题上）——因为Hint-L1几乎等于告诉AI解法。但这不意味着非特化策略有效——这只是题目特化的强提示效应。POC-3.5记录这个结果作为"特化提示的上界"参照。

---

## Hint-L2：低-中非特化程度

**非特化程度**：低-中
**提示词形态**：形态1（一句话指示）
**特征**：去掉了题目特定参数（具体模数），但保留了问题类型（排列存在性问题），操作仍然比较具体
**泄漏风险**：中——保留了问题类型信息，但不含题目特定参数

**Hint-L2文本**：
```
排列存在性问题中，考虑用模p分组，利用群结构分析排列的性质。
```

**为什么这是"低-中非特化程度"**：
- "排列存在性问题"是问题类型（比Hint-L1的"这道题"更一般，但仍限定了问题类型）
- "模p"保留了参数的符号形式（不指定p=4，但仍然指定了"用模p"这一操作类型）
- "群结构分析"比"对换结构"更一般（不指定具体的不变量类型）
- 这个Hint适用于排列存在性问题类，但不能迁移到其他类型的问题

**预期AI指导力**：中-高——去掉了题目特定参数后，AI需要自己确定p的值和分析的具体方向，但Hint仍然指明了问题类型和操作类型。

---

## Hint-L3：中等非特化程度（钟形曲线峰值附近）

**非特化程度**：中
**提示词形态**：形态1（一句话指示）
**特征**：去掉了问题类型和具体操作，只保留了TellCore的核心认知动作——"当陷入困境时切换到局部表示"。不指定用什么局部表示，不指定在局部表示下找什么结构
**泄漏风险**：低——不含题目特定参数，不含问题类型限定，只给认知策略

**Hint-L3文本**：
```
当问题在自然表示下陷入困境时，切换到局部表示Z/pZ。
```

**为什么这是"中等非特化程度"**：
- "自然表示下陷入困境"是trigger_boundary的渲染（不指定什么问题类型）
- "切换到局部表示Z/pZ"是internal_policy的核心动作（不指定在局部表示下做什么）
- "Z/pZ"仍保留了一个具体的选择（整数模p），但比Hint-L2的"模p分组"更一般——没有指定"分组"操作
- 这个Hint适用于所有可以用局部-全局表示切换解决的题，不限于排列问题

**为什么这是"钟形曲线峰值附近"**：根据396号§1用户的描述——"非特化程度太高了，AI不知道应该如何应用；非特化程度太低了，AI只掌握一道题怎么做"——Hint-L3恰好处于中间：它给了一个明确的认知动作（切换到局部表示），但留有足够的空间让AI自己确定参数和操作。

**预期AI指导力**：高——这是理论预测的峰值。Hint-L3给AI一个明确的方向（切换表示），但保留了足够的灵活性让AI适配不同题目。

---

## Hint-L4：中-高非特化程度（思维流程引导式）

**非特化程度**：中-高
**提示词形态**：形态2（思维流程/步骤引导式）
**特征**：不直接告诉AI做什么，而是一段逐步引导AI思维的流程——问问题、给步骤、引导AI自己发现"需要切换表示"这个方向
**泄漏风险**：低——不直接给认知动作，引导AI自己发现

**Hint-L4文本**：
```
你当前在什么表示下打转？
  → 识别当前表示的核心对象和操作
当前表示为什么走不通？
  → 列出已尝试的方向和它们失败的原因
这些方向都失败了，说明什么？
  → 当前表示可能缺少处理这个问题的结构
那哪个局部表示可能有隐藏结构？
  → 考虑Z/pZ或Q_p——哪个与问题的整数结构相关
  → 检查问题中是否有整除性、周期性或符号结构的线索
切换到这个局部表示后做什么？
  → 在局部表示下寻找不变量、周期性或符号结构
  → 将局部发现提升回全局表示
```

**为什么这是"中-高非特化程度"**：
- 不直接说"切换到Z/pZ"——而是引导AI自己发现"需要切换表示"并自己确定切换到什么
- 仍然包含"Z/pZ或Q_p"作为候选（没有完全不指定目标表示）——如果完全不指定，可能退化为形态3（抽象标签）
- 步骤引导提供了可操作性——AI不是拿到一个抽象标签不知道做什么，而是被引导逐步思考
- 这个Hint比Hint-L3更不特化（不直接给认知动作），但通过步骤引导可能恢复部分可操作性

**预期AI指导力**：中-高或高——根据347号的理论，形态2（思维流程引导式）可以让高Level概念恢复指导力。但实际效果需要实验验证——可能Hint-L4比Hint-L3更好（步骤引导比直接指示更有效），也可能更差（步骤太多增加认知负荷）。

**关键验证点**：Hint-L3 vs Hint-L4的对比直接验证347号的核心论断——"形态2是否比形态1在高Level上更有指导力"。

---

## Hint-L5：极高非特化程度（抽象标签）

**非特化程度**：极高
**提示词形态**：形态3（抽象标签）
**特征**：只有一个抽象的分类标签，没有具体操作引导。不指定切换到什么表示，不指定在局部表示下做什么，不给出步骤引导
**泄漏风险**：极低——不含任何操作信息

**Hint-L5文本**：
```
考虑表示切换。
```

**为什么这是"极高非特化程度"**：
- "表示切换"是一个完全抽象的认知策略标签——不指定切换到什么表示，不指定什么时候切换，不指定切换后做什么
- 这是347号§1定义的形态3（抽象标签）——"只有一个抽象的分类标签，没有具体操作引导"
- 347号明确说形态3"不应作为Tell存储——这是分类学坐标轴的刻度名，不是Tell本身"
- 但POC-3.5需要测试它，因为它是非特化程度谱系的极端——不测L5就不知道曲线的右端是什么样的

**预期AI指导力**：低——根据347号的理论，抽象标签"AI不知道具体该怎么做"。但实际效果需要实验验证——GLM-5.2 High可能有足够的内部知识，仅凭"表示切换"这个标签就能联想到Z/pZ和具体操作。如果Hint-L5也比bare好，说明模型内部知识弥补了Hint的信息不足。

---

## 5个HintInstance对照总表

| HintInstance | 非特化程度 | 提示词形态 | 包含什么 | 不包含什么 | 预期AI指导力 | 泄漏风险 |
|---|---|---|---|---|---|---|
| Hint-L1 | 极低（题目特化） | 形态1（一句话） | 具体模数+具体对象+具体操作 | 泛化能力 | 高（在这道题上） | 高 |
| Hint-L2 | 低-中 | 形态1（一句话） | 问题类型+符号参数+一般操作 | 题目特定参数 | 中-高 | 中 |
| Hint-L3 | 中（峰值附近） | 形态1（一句话） | 核心认知动作+一般表示 | 问题类型限定+具体操作 | 高（理论预测峰值） | 低 |
| Hint-L4 | 中-高 | 形态2（思维流程） | 步骤引导+候选表示 | 直接认知动作 | 中-高或高 | 低 |
| Hint-L5 | 极高（抽象标签） | 形态3（抽象标签） | 策略标签 | 操作信息+表示选择+步骤 | 低 | 极低 |
