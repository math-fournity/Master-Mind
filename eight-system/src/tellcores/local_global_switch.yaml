# TellCore v0: 局部-全局表示切换
# 来源：382号CasePack v0候选C + 383号字段消融最小充分字段集
# 日期：2026-08-15
# 状态：未经验证（Phase 0实验中）

tell_id: TellCore_v0_local_global_switch
name: 局部-全局表示切换

invariant_claim: |
  当问题在全局/自然表示下陷入困境时，
  切换到局部表示（Z/pZ或Q_p），
  在局部表示下揭示隐藏的代数结构，
  将局部发现提升为全局结论。

trigger_boundary:
  - 问题涉及整数的代数结构（整除性、素性、符号、幂、周期性）
  - 自然表示下的分析陷入困境
  - 问题中存在可以局部化的对象

negative_boundary:
  - 问题核心在构造性而非分析性
  - 问题核心在几何结构而非代数结构
  - 问题已经在局部表示下
  - 问题在自然表示下有直接解法
  - 问题的核心困难在搜索空间大小而非结构隐藏

parameter_slots:
  - p: 局部化的目标素数
  - level: 模p 或 p-adic赋值
  - objects: 需要局部化的对象

internal_policy:
  step2: 分析问题条件，确定局部化目标p和层次
  step3: 将问题映射到局部表示
  step4: 在局部表示下寻找隐藏结构
  step5: 将局部发现提升为全局结论或约束

progress_model:
  - 信号1: AI开始讨论"取模"或"p-adic赋值"
  - 信号2: AI在局部表示下发现了隐藏结构
  - 信号3: AI将局部发现与原问题目标建立联系
  - 信号4: AI成功将局部发现提升为全局结论

termination:
  - 成功: 局部发现直接解决原问题或给出关键约束
  - 无进展: 尝试多个p或层次后未发现有用结构 → 退出
  - 部分进展: 局部发现给出部分约束 → 标记，考虑组合或分case
  - 冲突: 局部化导致丢失必要信息 → 让位给全局分析Tell
