# POC-0.5 变形关系声明表——局部-全局表示切换

**资产编号**：POC-0.5-Asset-1
**服务POC**：POC-0.5变形关系声明
**依赖**：CasePack v1（✅已冻结2026-08-17，`poc_0/casepack_v1.md`）、383号TellCore v0候选C（✅）
**状态**：就绪

---

## 目标TellCore

局部-全局表示切换（Local Representation Switch）——383号TellCore v0候选C，7字段最小充分集：
1. invariant_claim：问题的全局困难在局部表示（Z/pZ或Q_p）下可被化简
2. trigger_boundary：在自然表示下反复尝试无法推进时
3. negative_boundary：问题本身不含整除性/周期性/符号结构时不适用
4. parameter_slots：原表示/局部表示的选择/不变量类型
5. internal_policy：引入局部表示→在局部表示下找结构→提升回全局
6. progress_model：在局部表示下发现整除性/周期性/符号结构
7. termination：局部表示下的发现已足以解决全局问题，或局部表示无隐藏结构

---

## 允许变换（不应改变Tell触发）

| 编号 | 变换类型 | 理由 | 验证方式 | 对应题目角色 |
|---|---|---|---|---|
| A1 | 变量重命名 | 不改变数学结构 | 构造重命名变形题，Tell应仍触发 | 变形题 |
| A2 | 数值缩放（如n→2n） | 不改变数学结构 | 构造缩放变形题，Tell应仍触发 | 变形题 |
| A3 | 对象换壳（整数→多项式→矩阵） | 保持"自然表示→局部表示"的切换结构 | 构造换壳变形题，Tell应仍触发 | 变形题 |
| A4 | 领域迁移（数论→组合→代数） | 局部-全局切换不限于数论 | 构造跨域变形题，Tell应仍触发 | 变形题 |
| A5 | 表示形式改变（mod p → p-adic → CRT多模数） | 都是局部表示 | 构造表示形式变形题，Tell应仍触发 | 变形题 |
| A6 | 叙事改变（同一数学结构换一种表述方式） | 不改变数学结构 | 构造叙事变形题，Tell应仍触发 | 变形题 |

## 禁止变换（应使Tell失效）

| 编号 | 变换类型 | 理由 | 验证方式 | 对应题目角色 |
|---|---|---|---|---|
| F1 | 机制破坏：问题核心在构造性而非整除性/周期性/符号结构 | 局部-全局切换不适用——构造性问题需要的是构造-分析-排除，不是表示切换 | 构造构造性题，Tell应拒绝 | 假朋友题 |
| F2 | 机制破坏：问题已在局部表示下 | 不需要切换——已经在局部表示中了 | 构造"已在模算术下"的题，Tell应拒绝 | 假朋友题 |
| F3 | 机制破坏：问题核心在几何而非代数 | 局部-全局切换（Z/pZ/Q_p）是代数工具，不适用于几何问题 | 构造几何题，Tell应拒绝 | 假朋友题 |
| F4 | 机制破坏：问题核心在分析估计而非代数结构 | 局部-全局切换是代数工具，不适用于分析估计问题 | 构造分析估计题，Tell应拒绝 | 假朋友题 |
| F5 | 机制破坏：问题有直接的经典解法，不需要切换 | Tell不是低搜索成本主路——有更短路径 | 构造有经典解法的题，Tell应拒绝或降权 | 假朋友题 |

## 边界变换（测试trigger边缘）

| 编号 | 变换类型 | 理由 | 验证方式 | 对应题目角色 |
|---|---|---|---|---|
| B1 | 去掉整除性约束（但保留周期性/符号结构） | trigger_boundary的边缘——整除性消失但其他结构还在 | 构造去掉整除性的题，Tell应标为boundary或abstain | 边界题 |
| B2 | 问题部分在自然表示可解，部分需要局部表示 | trigger_boundary的边缘——不是完全陷入困境 | 构造部分可解题，Tell应标为boundary | 边界题 |
| B3 | 局部表示有隐藏结构但不足以解决全局问题 | termination的边缘——局部发现不够 | 构造局部发现不够的题，Tell应触发但最终需回退 | 边界题 |

---

## 变形题构造原则

变形题按声明的允许变换**逐一构造**。每道变形题必须显式写出：
- 保留了什么（TellCore的因果内核——"自然表示陷入困境→切换到局部表示→在局部表示下找结构→提升回全局"）
- 改变了什么（表面特征——变量名/数值/对象类型/领域/表示形式/叙事）
- 对应哪个声明变换（A1-A6中的哪个）

## 假朋友题构造原则

假朋友题按声明的禁止变换**逐一构造**。每道假朋友题必须显式写出：
- 哪几个表面特征诱导误触发（如"题面涉及整数"诱导"用模算术"的误判）
- 哪一个关键结构缺失导致Tell不应执行（如"问题核心在构造性而非整除性"）
- 对应哪个禁止变换（F1-F5中的哪个）
