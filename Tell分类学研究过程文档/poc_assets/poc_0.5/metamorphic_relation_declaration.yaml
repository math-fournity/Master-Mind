## 映射审查记录

**审查日期**：2026-08-18
**审查范围**：将CasePack v1中已冻结的变形题/假朋友题/边界题，逐一映射到变形关系声明表的变换类型上

### 允许变换映射（A1-A6 → 变形题CC-009~012）

| 变换 | 对应题目 | 判断理由 |
|---|---|---|
| A2 → CC-009 | CC-009基于CC-001/1631，底数2→3 | 底数从2变为3是数值参数改变，数学结构（Mersenne型递推→mod分析→整除关系）保持不变。mod 8变为mod其他数是数值缩放的连带后果 |
| A2 → CC-010 | CC-010基于CC-002/1843，n=2016→2022 | n从2016变为2022是数值改变。CaseCard提到"2022不是4的倍数，需要选择不同的模数（如模6）"——模数选择的变化是数值缩放的连带后果，核心变换是数值n的改变 |
| A5 → CC-011 | CC-011基于CC-003/1709，2-adic→3-adic | CaseCard明确标注"完美p-adic变形"——2-adic赋值替换为3-adic赋值，被4整除→被9整除。这是表示形式的改变（mod p的p从2变为3），不是纯数值缩放 |
| A5 → CC-012 | CC-012基于CC-004/1962，2的幂→3的幂 | CaseCard明确标注"与1962同构——2-adic赋值替换为3-adic赋值"。v_2分析→v_3分析是表示形式改变 |

### 禁止变换映射（F1-F5 → 假朋友题CC-201~204）

| 变换 | 对应题目 | 判断理由 |
|---|---|---|
| F1 → CC-201 | CC-201 megaprime计数 | 表面有prime/divisibility，核心在容斥原理+组合集合分组。容斥+集合分组不是整除性/周期性/符号结构分析——符合F1核心意思"问题核心不在局部-全局切换能处理的结构"。注：容斥不是严格的"构造性"，但属于"非整除性/周期性/符号结构"的核心机制 |
| F1 → CC-203 | CC-203 部分和mod d的鸽巢 | 表面有mod d，核心在鸽巢原理+子集计数。鸽巢+子集计数不是整除性/周期性/符号结构分析——符合F1核心意思。CaseCard特别提到"AI实际尝试了Z/dZ上的Fourier分析，比标准解答更接近局部-全局切换但仍不是"——说明trigger需要区分"在Z/dZ上工作"和"通过Z/dZ切换表示来揭示隐藏结构" |
| F2 → CC-202 | CC-202 被3整除数的双色着色 | 表面有mod 3，核心在半群闭包+因数计数。问题在"被3整除的数"这个集合上工作——已在mod 3的语境下，不需要切换到局部表示。核心在局部语境下的代数操作（半群闭包），不是切换到局部表示来揭示隐藏结构 |
| F4 → CC-204 | CC-204 集合A+B mod N² | 表面有mod，核心在概率方法/期望论证。概率方法计算期望值是分析估计，不是代数结构分析——符合F4"分析估计而非代数结构"。CaseCard提到"AI实际尝试了加法组合（CRT分解Z_100=Z_4×Z_25、Kneser定理），比标准解答更接近局部-全局切换但仍不是" |

### 边界变换映射（B1-B3 → 边界题CC-301~302）

| 变换 | 对应题目 | 判断理由 |
|---|---|---|
| B3 → CC-301 | CC-301 AI已用F_2/Lucas但未完成 | AI已在F_2上工作，尝试最小化Hamming重量，搜索重量2或4的构造——已触及局部表示（F_2）但未发现一般不等式o(ΣQ)≥o(Q_{i_1})。局部发现不够——符合B3"局部表示有隐藏结构但不足以解决全局问题" |
| B2 → CC-302 | CC-302 AI已用p-adic但执行错误 | AI已用v_{2017}的p-adic赋值分析，正确识别了ℓ=2017，但错误应用凸性/Schur凸性论证得到6050（正确6052）。AI已部分解决（正确识别p-adic方向）但执行有误——符合B2"问题部分在自然表示可解，部分需要局部表示" |

### gap列表与处理

**共7个gap，全部选择A（标注"当前题包未覆盖，留待未来题包扩展"）：**

| gap变换 | gap原因 | 处理 |
|---|---|---|
| A1变量重命名 | 4道变形题均为数值/表示形式改变，无纯变量重命名变形题。变量重命名是最trivial的变换，CasePack v1选择了更有挑战性的变换 | 标注未覆盖，留待未来题包扩展 |
| A3对象换壳 | 4道变形题均基于source trace题的数值/表示形式改变，无将整数对象换为多项式/矩阵的变形题 | 标注未覆盖，留待未来题包扩展 |
| A4领域迁移 | 4道变形题均在数论领域内，无跨域变形题 | 标注未覆盖，留待未来题包扩展 |
| A6叙事改变 | 4道变形题改变了数值和表示形式，无纯粹改变叙事方式而保持数学结构不变的变形题 | 标注未覆盖，留待未来题包扩展 |
| F3几何而非代数 | 4道假朋友题均为数论/组合问题，无几何问题 | 标注未覆盖，留待未来题包扩展 |
| F5有经典解法不需要切换 | 4道假朋友题核心机制均不在局部-全局切换，但无特别标注"有经典解法不需要切换"的 | 标注未覆盖，留待未来题包扩展 |
| B1去掉整除性约束 | 2道边界题均为AI已触及局部表示的边界，无"去掉整除性约束但保留周期性/符号结构"的边界题 | 标注未覆盖，留待未来题包扩展 |

**gap处理原则**：声明表的诚实性比覆盖率更重要——不强行凑数。CasePack v1只有22道题（4道变形题+4道假朋友题+2道边界题），无法覆盖全部14个变换类型。7个gap是合理的——已覆盖的7个变换（A2/A5/F1/F2/F4/B2/B3）有充分的对应题目，gap标注为"留待未来题包扩展"供后续题包补充。
