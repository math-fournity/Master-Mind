## 三候选Pareto初评（证据等级：R4/R6双trace结构分析，非运行时实验）

| 维度 | 候选Ⅰ | 候选Ⅱ | 候选Ⅲ |
|---|---|---|---|
| 触发准确率 | 高（触发点明确：公式导出/异常结论） | 高（强否定结论前强制） | 中（失效信号识别需经验） |
| 操作可执行性 | 高（六步步进清晰） | 高（六步协议） | 中-高（阶梯映射需按题定制next_rung） |
| 近迁移效用 | 高（一切含实例可代的问题） | 高（一切强否定结论场景） | 中-高（方程组/幂载体类问题直接适用） |
| 远迁移效用 | 中-高（"用实例校验抽象结论"跨域通用） | 中（强否定场景跨域存在但频率低） | 中（"失效信号驱动升级"是通用元模式） |
| 负迁移率 | 低（实例不过关自然回退） | 低（协议自带复验） | 中（阶梯选择错误会绕路——靠failure_signal命名精度缓解） |
| 提示成本 | 中 | 中 | 中-高（含阶梯映射表） |
| 泄漏风险 | 低（策略层不含题目特定内容） | 低 | 低 |
| 可持续学习 | **高**（domain_tag台账天然支持反例学习） | **高**（依赖图支持精确归因） | 中（失效信号词表可持续扩充） |

**预期Pareto前沿**：{Ⅰ, Ⅱ, Ⅲ}三者互不支配（Ⅰ重可信度建设、Ⅱ重纠错安全、Ⅲ重推进效率），与1962实验中R4的实际行为完全吻合——三种策略在同一场推理中全部登场且各自不可或缺。

