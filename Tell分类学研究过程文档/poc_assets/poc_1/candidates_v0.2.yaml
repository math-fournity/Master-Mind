## 候选Ⅲ · 信号驱动的工具升级阶梯（Signal-Driven Tool Ladder）

```yaml
tellcore_id: V02-III-tool-ladder
name: 信号驱动的工具升级阶梯
invariant_claim: |
  每类解题工具有各自的失效信号："无信息"（输出多种残差组合都通）、
  "平凡"（只得到恒真/恒假的弱结论）、"循环"（终点结构等同于起点）、
  "太强"（推论强得可疑）。给这些信号命名并尊重其判决：失效即沿信息
  保真度阶梯换更强工具，而不是在同一工具上加大尝试次数。
  当需同时维持的关系数超过约五条时，外化为命名系统+编号台账。
trigger_boundary: |
  触发：当前工具输出上述任一失效信号时；推导需要在多个量之间反复
  引用时（外化记账触发）。
  不适用：工具仍在产出非平凡约束时（哪怕进展慢）——慢而有效优于快而空转。
negative_boundary: |
  阶梯顶端仍无进展 ⟹ 不是继续换工具，而是把该情形标记为硬骨头
  转专职攻坚（或接受预算约束下的阶段性收尾）。
parameter_slots:
  - slot_name: current_tool          # 当前失效的工具类别
  - slot_name: failure_signal        # 命名的失效信号
  - slot_name: ledger                # 外化台账（记号系统+关系编号清单）
  - slot_name: next_rung             # 阶梯上的下一级工具
internal_policy: |
  1. 识别当前工具的失效信号类型并命名
  2. 按信息保真度阶梯选择下一级：同余试探→赋值读数→精确方程消元
     →比值/商结构→整除性消化→双侧夹逼
  3. 关系数>5时停止推进，建立符号台账（记号定义+关系编号R1..Rn）
  4. 新工具在一个位置成功后，立即对称复制到全部同类位置
  5. 新工具建成后扫一遍所有未决问题，寻找与既有结果的交叉印证
  6. 平凡结果如实标记（"Trivial. Hmm."），不硬包装成进展
progress_model: |
  - 新工具产出第一个非平凡约束
  - 台账建立完成且后续引用零歧义
  - 工具升级序列可复盘（每级升级由上一级失效信号触发，非偏好跳跃）
termination: |
  - 阶梯顶端仍无进展 → 情形标记硬骨头
  - 新工具与旧路线交叉印证一致 → 可信度升级，该线闭合
```

**双源锚点**：
- R4：动作3（"No info"放弃同余线）、动作9（第二次无信息→整类工具边界认定）、动作10（比值结构转向）、动作12（"Trivial. Hmm."弃线）、动作15（"circular"止损）、动作16（符号台账R1-R5）
- R6：L006段（"run machine verification to be thorough…then write"——先机验后写作的顺序纪律）；L007段（"write first version of 工作笔记.md, then do the careful re-verification"——外化记账先行）

