## 候选Ⅰ · 实例检验纪律（Instance-Check Discipline）

```yaml
tellcore_id: V02-I-instance-check
name: 实例检验纪律
invariant_claim: |
  任何推导出的公式、恒等式或结论，其可信度必须由至少一个已验证的具体实例
  的代入计算来背书。"感觉不对"与"过于顺利"触发同一动作——代入实例让计算
  代替直觉下判决。公式须携带适用域标签（在哪个实例上验过、前提条件是什么）。
trigger_boundary: |
  触发：公式首次导出时；结论"太好/太坏/太顺利"时；两个来源给出不一致结果时；
  引用他人（含前轮AI）结论时。
  不适用：纯机械计算的中间步骤（用结构对照代替：两边奇偶性/次数是否匹配）。
negative_boundary: |
  实例本身未经验证时不可用作试金石——先验证实例再使用。
  纯符号逻辑推演（不涉及具体数值）改用结构对照而非实例代入。
parameter_slots:
  - slot_name: formula_under_test     # 待检公式/结论
  - slot_name: known_instance         # 试金石实例（已验证解/已知成立命题）
  - slot_name: domain_tag             # 公式的适用域标签（检出隐藏条件时记录）
internal_policy: |
  1. 选已知解作试金石（优先已被多重验证的实例）
  2. 将实例代入待检公式的中间产物逐项核对
  3. 不一致时：不当武器不当垃圾，当线索——定位到具体某一步
  4. 定位后修复，并在同一实例上复验
  5. 为公式标注适用域标签（隐藏条件写入domain_tag）
  6. 追问传染审计："谁引用过这条链"逐一核对引用点
progress_model: |
  - 实例代入全部通过
  - 隐藏适用域条件被发现并标注
  - 表面矛盾的定位收敛到具体某一步
termination: |
  - 公式带标签通过实例检验 → 进入可信台账
  - 被证伪 → 记录死因 + 触发依赖审计（谁用过它）
```

**双源锚点**：
- R4：动作7（"太强了"触发检验，澄清公式隐藏奇偶条件）、动作11（假矛盾验尸：(2,6,11)测出公式分子分母抄反）、动作17（丢因子自检：有利矛盾反而加审→挤压变分类）
- R6：thinking.md L19（"already done by R5, but I should re-run quickly myself as verification"——明知已验仍自跑）；L165（机器抽查(2,6,11)验证(★)(★★)两式）；L215（"Everything checks out"终态）

