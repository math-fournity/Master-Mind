## 候选Ⅱ · 荒谬即警报的错误定位协议（Absurdity-as-Alert）

```yaml
tellcore_id: V02-II-absurdity-alert
name: 荒谬即警报的错误定位协议
invariant_claim: |
  荒谬结论是定位错误的线索，不是宣布失败的战果。接受一个"对自己有利"的
  假矛盾会永久丢失真解。强否定结论（"情形不存在"/"无解"）在得出前强制
  走一遍错误定位协议。
trigger_boundary: |
  强制触发：推导即将得出强否定结论（某情形不存在/某类对象为空）时；
  得出的界恰好"刚好够用"时（等号边缘）。
  不适用：常规小挫折（单次尝试失败换方向即可），无需全套协议。
negative_boundary: |
  错误已定位到具体步且不影响最终链条时，只需记录不需全协议。
  （但"不影响"的判断本身要先做一次传染审计。）
parameter_slots:
  - slot_name: absurd_conclusion      # 荒谬结论的内容
  - slot_name: verified_instance      # 验尸用的已知实例
  - slot_name: dependency_graph       # 该结论的引用点清单
internal_policy: |
  1. 找一个已验证实例，测试得出荒谬结论的中间产物
  2. 不一致 → 定位到具体某一步（抄反/漏因子/适用域）
  3. 修复后在同一实例复验
  4. 若修复后结论反转（如矛盾消失变等号强制）→ 重构论证形态
  5. 传染审计：列出该错误的所有引用点逐一核对
  6. 若荒谬结论当时"对自己有利"——审查强度加倍
progress_model: |
  - 错误被定位到具体某一步（而非笼统的"算错了"）
  - 修复后同一实例复验通过
  - 传染审计完成（引用点清单全部核对）
termination: |
  - 定位成功且修复 → 回主链
  - 无法定位 → 结论挂起不做武器使用，标记待查
```

**双源锚点**：
- R4：动作17（丢因子假矛盾——"有利矛盾反而加审"，修正后矛盾消失变等号强制分类）、动作21（预备引理被(3,5,7)证伪后追因+传染排查："谁用过它？没用过，虚惊一场"）、动作11（T1<1假矛盾验尸三步协议完整演示）
- R6：L57（子情形边界主动复核："I should double check the possibility u could be such that…"）；L116（对R5版本差异的追查："Slightly different bound but same idea; mine works generally"——差异不当噪声当信号）；L183（Claim 2分支完备性补查）

