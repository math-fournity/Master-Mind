## 8维度Pareto前沿评分表

对3个候选TellCore按以下8维度评分（0-2分）：

| 维度 | 0分 | 1分 | 2分 | 候选A | 候选B | 候选C |
|---|---|---|---|---|---|---|
| 触发准确率 | 经常误触发 | 偶尔误触发 | 精确触发/拒绝 | ? | ? | ? |
| 操作可执行性 | AI不知道做什么 | AI知道大致方向 | AI知道具体步骤 | ? | ? | ? |
| 近迁移效用 | 同类型题无效 | 同类型题部分有效 | 同类型题有效 | ? | ? | ? |
| 远迁移效用 | 不同类型题无效 | 不同类型题部分有效 | 不同类型题有效 | ? | ? | ? |
| 负迁移率（越低越好） | 经常误导 | 偶尔误导 | 从不误导 | ? | ? | ? |
| 提示成本（越低越好） | 很长很复杂 | 中等长度 | 简洁 | ? | ? | ? |
| 泄漏风险（越低越好） | 高泄漏 | 中泄漏 | 低泄漏 | ? | ? | ? |
| 可持续学习 | 无法从反例学习 | 可粗略归因 | 可精确诊断+修复 | ? | ? | ? |

评分在POC-1执行时填写。Pareto前沿分析：保留在所有维度上不被其他候选支配的候选集合。

**预期结果**：
- 候选A（无负边界）：触发准确率低（0分），但其他维度与B相当→被B在触发准确率维度上支配
- 候选B（7字段baseline）：触发准确率中（1分，有负边界但无critic完善）、操作可执行性中（1分，有internal_policy但无binding_rules）、可持续学习低（0分，无critic）
- 候选C（扩展版）：触发准确率中-高（1-2分，有负边界+critic诊断误触发）、操作可执行性高（2分，有binding_rules）、可持续学习高（2分，有critic）
- **预期Pareto前沿**：候选B和候选C都在前沿上——B在"提示成本"和"简洁性"上占优，C在"操作可执行性"和"可持续学习"上占优。候选A被B支配。
